<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>GlowTap Customer — My Tickets</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" />
  <style>
    :root {
      --ink: #1A2330; --muted: #6B7A88; --line: #E5EAF0; --violet: #7B00FF;
      --grad: linear-gradient(100deg, #7B00FF 0%, #9B2FD9 48%, #FF03C8 100%);
      --surface: #F7F4FA; --phone-w: 390px; --phone-h: 844px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif; background: #100818; color: var(--ink);
      display: flex; align-items: center; justify-content: center; min-height: 100dvh; padding: 24px 16px;
    }
    .studio { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse 55% 40% at 75% 5%, rgba(123,0,255,.35), transparent 60%), #100818; }
    .stage { position: relative; z-index: 1; width: var(--phone-w); height: var(--phone-h); }
    .phone {
      width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: var(--surface);
      box-shadow: 0 0 0 9px #171022, 0 0 0 11px #2c1a42, 0 36px 70px rgba(0,0,0,.55);
      display: flex; flex-direction: column; position: relative;
    }
    .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 110px; height: 32px; background: #050308; border-radius: 20px; z-index: 40; pointer-events: none; }
    .status { position: absolute; top: 0; left: 0; right: 0; height: 52px; z-index: 35; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 28px 10px; font-size: .72rem; font-weight: 600; pointer-events: none; }
    .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 52px; }
    .nav { display: flex; align-items: center; gap: 10px; padding: 4px 14px 10px; background: #fff; }
    .back { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--ink); text-decoration: none; }
    .back svg { width: 18px; height: 18px; }
    .nav h1 { margin: 0; flex: 1; font-family: Outfit, sans-serif; font-size: 1.05rem; font-weight: 700; }
    .nav a.new {
      font-size: .75rem; font-weight: 700; color: #fff; text-decoration: none; padding: 8px 12px;
      border-radius: 999px; background: var(--grad); box-shadow: 0 4px 12px rgba(123,0,255,.28);
    }
    .body { flex: 1; overflow-y: auto; padding: 12px 16px 28px; scrollbar-width: none; }
    .body::-webkit-scrollbar { display: none; }
    .ticket {
      display: block; text-decoration: none; color: inherit; background: #fff; border-radius: 16px;
      padding: 14px; margin-bottom: 10px; border: 1px solid rgba(123,0,255,.06);
      box-shadow: 0 6px 18px rgba(30,42,50,.04);
    }
    .ticket__top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .ticket__id { font-size: .7rem; font-weight: 700; color: var(--muted); }
    .badge { padding: 4px 9px; border-radius: 999px; font-size: .68rem; font-weight: 700; }
    .badge--open { background: #EEF2FF; color: #4338CA; }
    .badge--progress { background: #FFF7ED; color: #C2410C; }
    .badge--resolved { background: #ECFDF5; color: #047857; }
    .ticket__title { margin: 0 0 4px; font-family: Outfit, sans-serif; font-size: .95rem; font-weight: 700; }
    .ticket__meta { margin: 0; font-size: .75rem; color: var(--muted); }
    @media (max-width: 430px) {
      body { padding: 0; align-items: stretch; }
      .studio, .island, .status { display: none; }
      .stage, .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; }
      .screen { padding-top: max(12px, env(safe-area-inset-top)); }
    }
  </style>
</head>
<body>
  <div class="studio" aria-hidden="true"></div>
  <div class="stage">
    <div class="phone">
      <div class="island" aria-hidden="true"></div>
      <div class="status" aria-hidden="true"><span>9:41</span><span></span></div>
      <div class="screen">
        <div class="nav">
          <a class="back" href="support.html" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 6-6 6 6 6"/></svg></a>
          <h1>My tickets</h1>
          <a class="new" href="contact.html">New</a>
        </div>
        <div class="body">
          <a class="ticket" href="ticket-detail.html?id=TK-2041">
            <div class="ticket__top">
              <span class="ticket__id">TK-2041</span>
              <span class="badge badge--progress">In progress</span>
            </div>
            <h2 class="ticket__title">Refund not reflected</h2>
            <p class="ticket__meta">Payment / refund · Updated 2 hr ago</p>
          </a>
          <a class="ticket" href="ticket-detail.html?id=TK-1988">
            <div class="ticket__top">
              <span class="ticket__id">TK-1988</span>
              <span class="badge badge--open">Open</span>
            </div>
            <h2 class="ticket__title">Wrong specialist assigned</h2>
            <p class="ticket__meta">Booking issue · Created yesterday</p>
          </a>
          <a class="ticket" href="ticket-detail.html?id=TK-1902">
            <div class="ticket__top">
              <span class="ticket__id">TK-1902</span>
              <span class="badge badge--resolved">Resolved</span>
            </div>
            <h2 class="ticket__title">Unable to reschedule</h2>
            <p class="ticket__meta">Booking issue · Closed 12 Aug</p>
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
